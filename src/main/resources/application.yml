spring:
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: neo4j
      password: ${NEO4J_PASSWORD:password}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000

cloudflare:
  r2:
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}
    bucket: ${R2_BUCKET}
    endpoint: ${R2_ENDPOINT}

youtube:
  api:
    key: ${YOUTUBE_API_KEY}
  featured-channel-ids: "UCcQTRi69dsVYHN3exePtZ1A,UCF4Wxdo3inmxP-Y59wXDsFw,UCkinYTS9IHqOEwR1Sze2JTw,UCsU-I-vHLiaMfV_ceaYz5rQ,UChlgI3UHCOnwUGzWzbJ3H5w"

ai-pipeline:
  base-url: ${AI_PIPELINE_URL:http://localhost:8000}
  transcript:
    min-call-interval-ms: ${AI_TRANSCRIPT_MIN_CALL_INTERVAL_MS:450}
    max-retries: ${AI_TRANSCRIPT_MAX_RETRIES:3}
    initial-backoff-ms: ${AI_TRANSCRIPT_INITIAL_BACKOFF_MS:700}
    no-transcript-cooldown-ms: ${AI_TRANSCRIPT_NO_TRANSCRIPT_COOLDOWN_MS:900000}

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}
  redirect-uri: ${KAKAO_REDIRECT_URI}

google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  redirect-uri: ${GOOGLE_REDIRECT_URI}
  translate:
    api-key: ${GOOGLE_TRANSLATE_API_KEY}

server:
  port: 8080

python:
  base-url: ${PYTHON_BASE_URL:http://localhost:8000}
  kg:
    base-url: ${PYTHON_KG_BASE_URL:http://127.0.0.1:8000}

issue:
  search:
    auto-cluster-enabled: true
